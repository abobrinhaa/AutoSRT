# Empacota o AutoSRT.exe e publica no Release da tag, em vez de o binário
# viver versionado no repositório (ver .gitignore). Dispara em tags "v*",
# ex.: v2.0.0.
name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Empacotar AutoSRT.exe
        run: pyinstaller --onefile --name AutoSRT AutoSRT.py

      - name: Publicar no Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoSRT.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
